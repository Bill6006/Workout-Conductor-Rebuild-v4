name: CI

# Verification pipeline: install, lint, type-check, unit tests, build, privacy scan,
# browser smoke test. Runs on pull requests and non-main pushes, and is reused by
# the Pages deployment workflow so a deploy can only follow a fully green check.

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload the built dist folder as the GitHub Pages artifact
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, types, unit, build, privacy, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Privacy scan
        run: npm run privacy-scan

      - name: Verify build output
        run: npm run verify-build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: ${{ inputs.upload-pages-artifact == true }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
